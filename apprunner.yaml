version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npx prisma generate
      - npm run build
run:
  runtime-version: 22
  # `npm start` already runs `prisma migrate deploy` before `next start` (see
  # package.json) -- same migration-on-boot approach render.yaml's
  # preDeployCommand uses for staging, kept consistent across both targets.
  command: npm start
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_OPTIONS
      value: --max-old-space-size=400
