version: 1.0
runtime: nodejs22
build:
  commands:
    build:
      - npm ci
      - npx prisma generate
      - npm run build
run:
  runtime-version: 22
  # App Runner has no separate pre-deploy hook (unlike render.yaml's
  # preDeployCommand), so `start:migrate` runs the migration check here,
  # once, as part of boot. Render instead runs migrations only in
  # preDeployCommand and starts via the plain `npm start`, so a restart
  # that isn't a fresh deploy doesn't re-run migrations before listening.
  command: npm run start:migrate
  network:
    port: 3000
    env: PORT
  env:
    - name: NODE_OPTIONS
      value: --max-old-space-size=400
