<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="No photo uploaded yet for this trek">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ff9933" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff9933" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#1c1c1c"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <polygon points="0,420 140,270 240,360 340,230 460,380 560,260 660,350 800,240 800,600 0,600" fill="url(#ridgeFar)"/>
  <polygon points="0,470 180,340 320,440 480,310 620,430 800,330 800,600 0,600" fill="url(#ridgeNear)"/>

  <path d="M300 320 L340 260 L365 290 L400 240 L470 320 Z" fill="#2a2a2a" opacity="0.9"/>
  <path d="M340 260 L352 275 L328 290 Z" fill="#ff9933" opacity="0.55"/>

  <g transform="translate(400 470)" opacity="0.9">
    <text x="0" y="0" text-anchor="middle" font-family="Outfit, system-ui, sans-serif" font-weight="800" font-size="13" letter-spacing="3" fill="#ff9933">PARAM ADVENTURES</text>
    <text x="0" y="22" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="600" font-size="12" letter-spacing="1" fill="#e0e0e0" fill-opacity="0.55">Photo coming soon</text>
  </g>
</svg>
